l_english:
 prussian_dusk_era_title:0 "Prussian Dusk"
 prussian_dusk_era_desc:0 "It has been four years since French troops ended their advance into German territory, yet the bloodshed still continues. The once grand Central Powers have been shattered beyond recognition, and in their place lies only anarchy. The former great powers of Europe have been crippled and divided, while the nations of France and Poland grow stronger by the day."
 POL_PRUSSIAN_DUSK_DESC:0 "Whilst awaiting the Kaiser's surrender, Polish troops found themselves still pushing deeper into Russian lines, securing key cities up to the dnieper for the young Polish state. The great amount of manpower and resources allowed for the eventual 1920 invasion of Germany and Austria-Hungary. Led by Józef Piłsudski and backed by the Entente, the Poles liberated thousands of slavic peoples from former German and Hungarian oppression.. Now, with peace established, they have oragnised former Austro-Hungarian and Russian states, all grateful to their liberators, to create the Intermarium, a bastion of peace and stability which spreads from the Baltic to the Black Sea."
