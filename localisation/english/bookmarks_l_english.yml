l_english:
 prussian_dusk_era_title:0 "Prussian Dusk"
 prussian_dusk_era_desc:0 "It has been four years since French troops ended their advance into German territory, yet the bloodshed still continues. The once grand central powers have been shattered beyond recognition in their place lies only anarchy. Once great powers have become crippled and divided, with others only becoming stronger for it."
 POL_PRUSSIAN_DUSK_DESC:0 "Whilst awaiting the Kaiser's surrender, Polish troops found themselves still pushing deeper into Russian lines, securing key cities up to the dnieper for the young Polish state. This manpower and resources led to the eventual 1920 invasion of Germany and Austria-Hungary, led by Józef Piłsudski and backed with French Aid, they liberated thousands of Slavs from Germanic oppression. Now, with peace established, they have formed a collection of former Austro-Hungarian and Russian states grateful to the cause as a bastion of peace between the Baltic, Black, and Adriatic seas"
 FRA_PRUSSIAN_DUSK_DESC:0 "WIP"
