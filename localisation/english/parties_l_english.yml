l_english:
 authoritarian_socialist:0 "Authoritarian Socialist"
 authoritarian_socialist_noun:0 "Authoritarian Socialism"
 authoritarian_socialist_desc:0 "Totalitarian Regime"
 bolshevism_desc:0 "Bolshevism is a general term referring to the governing system and ideology of the Russian Bolsheviks. It values a strong state to stop any reactionary and counter-revolutionary forces, and follows a policy of high militarisation."
 anarchist:0 "Anarchist"
 anarchist_noun:0 "Anarchism"
 anarchist_desc:0 "Stateless Society"
 platformism_desc:0 "Platformism is an anarchist organizational theory that aims to create a tightly coordinated anarchist federation. Its main features include a common tactical line, federalism, a unified political policy and a commitment to collective responsibility."
 anarcho_communism_desc:0 "Anarcho-communism advocates a form of stateless communism. It calls for the abolition of all private property as well as social ownership of property and the distribution of resources. It is strongly opposed to movements such as the Bolsheviks, viewing their obsession with the state as a betrayal to leftist ideals."
 libertarian_socialist:0 "Libertarian Socialist"
 libertarian_socialist_noun:0 "Libertarian Socialism"
 libertarian_socialist_desc:0 "Libertarian Regime"
 council_communism_desc:0 "Council communism is a left-communist thought popularised by the Spartacus League in Germany, which split from the Social Democratic Party due to opposing views on the Great War. It advocates for workers' councils to control governance and is opposed to Bolshevism due to its authoritarian tendencies."
 syndicalism_desc:0 "Syndicalism is a labour movement which seeks to unionise the workers and advance their demands through direct action, with the eventual goal of gaining control over the means of production through social ownership. It advocates for a federation of trade unions to control governance rather than liberal democratic parliaments or mass workers' parties."
 left_wing_tridemism_desc:0 "The Three Principles of the People is a political philosophy developed by Sun Yat-sen. The three principles are often translated into and summarized as nationalism, democracy, and the livelihood of the people (or welfarism). This philosophy has been claimed as the cornerstone of the nation's policy as carried by the Kuomintang."
 progressive:0 "Progressive"
 progressive_noun:0 "Progressivism"
 progressive_desc:0 "Libertarian Regime "
 democratic_socialism_desc:0 "Democratic socialism supports political democracy and some form of socially owned economy, with emphasis on worker self management. Contrary to most forms of socialism, it rejects revolution, instead advocating for reform within the system to acheive socialism."
 tridemism_desc:0 "The Three Principles of the People is a political philosophy developed by Sun Yat-sen. The three principles are often translated into and summarized as nationalism, democracy, and the livelihood of the people (or welfarism). This philosophy has been claimed as the cornerstone of the nation's policy as carried by the Kuomintang."
 social_democracy_desc:0 "Social democracy typically supports a reformist and democratic approach to the socialist ideology. However, unlike democratic socialism, it often seeks to reform capitalism into a better system for the workers, rather than completely replace the system itself."
 social_liberalism_desc:0 "Social liberalism is a progressive form of liberalism that emphasises social justice and a mixed economy, as opposed to classical liberalism which favours limited government and laissez-faire style economics"
 liberal:0 "Liberal"
 liberal_noun:0 "Liberalism"
 liberal_desc:0 "Democratic Regime"
 classical_liberalism_desc:0 "Classical liberalism advoactes for free market capitalism and laissez-faire economics, as well as civil liberties and rule of law, especially emphasising individual autonomy, freedom of speech, and economic freedom. It looks more negatively on social policies and taxation, as well as advocating for deregulation of the economy"
 right_libertarianism_desc:0 "Right-Libertarianism, sometimes called anarcho-capitalism, supports capitalist property rights and is strongly against things like social policies, regulation, and taxation. It is opposed to left-libertarianism, which supports self-ownership and collectivist economics."
 national_liberalism:0 "National liberalism combines liberal policies, such as laissez-faire economics and individual rights, with nationalist ideas. It usually emphasises moderate social conservatism, and for this reasin has been sometimes used in the same meaning as conservative liberalism."
 conservative:0 "Conservative"
 conservative_noun:0 "Conservatism"
 conservative_desc:0 "Democratic Regime"
